name: Generate User Documentation

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'https://plankanban.github.io/planka/'
        required: true
        default: 'https://plankanban.github.io/planka/'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci && npx playwright install --with-deps chromium

      - name: Run documentation agent
        run: node scripts/capture-and-document.js "${{ github.event.inputs.url }}"
        env:
          # (Опционально) ваш API-ключ, если решите подключить внешнюю модель
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Upload generated docs
        uses: actions/upload-artifact@v4
        with:
          name: user-documentation
          path: output/
