name: 🤖 AI Documentation Agent

on:
  workflow_dispatch:
    inputs:
      project_url:
        description: 'Ссылка на демо-страницу проекта'
        required: true
        default: 'https://plankanban.github.io/planka'

jobs:
  generate_docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v4

      - name: Установка зависимостей
        run: |
          pip install shot-scraper google-genai beautifulsoup4 requests

      - name: Установка браузера для скриншотов
        run: shot-scraper install

      - name: Запуск ИИ-агента
        env:
          API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PROJECT_URL: ${{ github.event.inputs.project_url }}
        run: python .github/scripts/generate.py

      - name: Сохранить сгенерированную документацию
        if: success()
        run: |
          if [ -d docs ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add docs/
            git diff --staged --quiet || (git commit -m "Авто-генерация руководства пользователя" && git push)
          fi
